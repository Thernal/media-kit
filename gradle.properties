# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC
kotlin.incremental=true
kotlin.incremental.multiplatform=true

# Kotlin Native
kotlin.incremental.native=true

# Gradle
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# The package prefix every module's namespace starts with — build-kit's property, the same derivation.
app.namespace=io.thernal.mediakit

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
