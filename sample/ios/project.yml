# The iOS sample. `xcodegen generate` (in this directory) rebuilds Sample.xcodeproj from this file;
# the generated project is committed so opening the sample needs Xcode only.
name: Sample
options:
  bundleIdPrefix: io.thernal.mediakit
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Sample:
    type: application
    platform: iOS
    sources:
      - Sample
    info:
      path: Sample/Info.plist
      properties:
        CFBundleDisplayName: media-kit
        UILaunchScreen: {}
        # Compose Multiplatform refuses to start without it: high refresh rates need it on iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        # The camera needs a usage description; the photo picker (PHPicker) and the document picker need none.
        NSCameraUsageDescription: The sample takes a photo to crop.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.thernal.mediakit.sample
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework SampleShared"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The framework is built for arm64 simulators only (iosSimulatorArm64), as every kit targets.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :sample:shared:embedAndSignAppleFrameworkForXcode
