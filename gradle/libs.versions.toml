[versions]
# Language / toolchain
kotlin = "2.4.10"
jvm = "17"

# Build tooling
agp = "9.2.1"

# Android SDK
android-compile-sdk = "37"
android-min-sdk = "24"
android-target-sdk = "37"

# Compose Multiplatform
compose-multiplatform = "1.12.0"

# The sample's UI only; the kit's modules do not use Material.
compose-material3 = "1.9.0"

# Coil 3 draws the crop and preview images (and downsamples large photos).
coil = "3.5.0"

# AndroidX, Android only: the picker and permission launchers, FileProvider, EXIF orientation.
androidx-activity = "1.13.0"
androidx-core = "1.19.0"
androidx-exifinterface = "1.4.1"

# KotlinX
kotlinx-coroutines = "1.11.0"

# Dependency injection — Metro, for the wiring module and the sample's graph.
metro = "1.4.2"

# Static analysis
detekt = "2.0.0-alpha.2"

# Testing (JVM-only, for the custom Detekt rules in build-logic)
junit4 = "4.13.2"

[libraries]
# Gradle plugins resolved on the build-logic classpath
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

# Compose Multiplatform
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }

# Images
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidx-exifinterface" }

# KotlinX
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

# Dependency injection
metro-runtime = { module = "dev.zacsweers.metro:runtime", version.ref = "metro" }

# Static analysis
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "dev.detekt:detekt-test", version.ref = "detekt" }
detekt-ktlint-wrapper = { module = "dev.detekt:detekt-rules-ktlint-wrapper", version.ref = "detekt" }
junit4 = { module = "junit:junit", version.ref = "junit4" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }

# Conventions (build-logic)
mediakit-kmp-library = { id = "io.thernal.mediakit.kmp.library" }
mediakit-compose = { id = "io.thernal.mediakit.compose" }
mediakit-injection = { id = "io.thernal.mediakit.injection" }
mediakit-android-application = { id = "io.thernal.mediakit.android.application" }
